server:
  port: "${SERVER_PORT:8080}"

spring:
  application:
    name: canonical-redirector
  web:
    error:
      whitelabel:
        enabled: false

application:
  title: "ZTS Canonical Redirector"
  accessToken: "${ACCESS_TOKEN:}"
  resourcesList: "${RESOURCES_LIST:https://terminologien.bfarm.de/terminologies/resourceslist.json}"
  pathToResourcesFile: "${PATH_TO_RESOURCES_FILE:target/files/resources_list.json}"
  timeInterval: "${TIME_INTERVAL:600000}"
  contentBaseURL: "${CONTENT_BASE_URL:https://dev.terminologien.bfarm.de}"
  api-docs:
    serverUrls:
      - ${application.contentBaseURL}
    title: "ZTS Canonical Redirector API"
    version: "@project.version@"

logging:
  level:
    root: "${LOGGING_ROOT_LEVEL:INFO}"
    org:
      springframework:
        boot: "${LOGGING_SPRINGBOOT_LEVEL:WARN}"
        web:
          reactive: "${LOGGING_WEB_REACTIVE_LEVEL:WARN}"
        webflux: "${LOGGING_WEBFLUX_LEVEL:WARN}"
    de:
      gematik:
        zts:
          redirector: "${LOGGING_REDIRECTOR_LEVEL:INFO}"

springdoc:
  api-docs:
    enabled: true
    path: /docs/v3/api-docs
    version: openapi_3_0
  paths-to-exclude: /api/health
  auto-tag-classes: true
  swagger-ui:
    enabled: false

cache:
  cpublic: "${CACHE_IS_PUBLIC:true}"
  noCache: "${CACHE_NO_CACHE:false}"
  noStore: "${CACHE_NO_STORE:false}"
  maxAge: "${CACHE_MAX_AGE:600}"

management:
  server:
    port: "${MANAGEMENT_PORT:8080}"
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,sbom
    access:
      max-permitted: read-only
      default: read-only
    info:
      access: read-only
      env:
        enabled: false
    prometheus:
      access: read-only
    health:
      access: read-only
      probes:
        access: read-only
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true
    metrics:
      access: read-only
      export:
        prometheus:
          enabled: true
    sbom:
      access: read-only
